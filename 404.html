<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Patrick Raymond Andreas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8e8e5">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 18px;
    padding: 10vh 6vw;
  }
  .notfound__code {
    font-family: var(--font-display, inherit);
    font-weight: 700;
    font-size: clamp(64px, 14vw, 160px);
    line-height: 1;
    color: var(--ink);
  }
  .notfound__actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body data-motion="off">

<div class="grid-backdrop" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<main class="shell notfound">
  <div class="hero__kicker">
    <span class="mk"></span>
    <span class="mono">404</span>
    <span class="mono dim">Page not found</span>
  </div>
  <div class="notfound__code">404</div>
  <p class="lede">
    This page doesn't exist. It may have moved, or the link was mistyped.<br>
    <span class="dim">Halaman ini tidak ditemukan — mungkin sudah dipindahkan atau tautannya salah ketik.</span>
  </p>
  <div class="notfound__actions">
    <a class="btn btn--primary" href="/">Back to home</a>
    <a class="btn btn--ghost" href="/#contact">Contact</a>
  </div>
</main>

</body>
</html>
